<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotFlix</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="global-navbar" id="main-nav">
        <div class="nav-left">
            <div class="nav-logo-container">
                <img src="logo.svg" alt="Notflix Popcorn Logo" class="brand-logo-img">
            </div>
            <span class="brand-title">NOTFLIX</span>
        </div>

        <ul class="nav-links-categories" id="nav-categories">
            <li class="category-item" data-page="action"><a href="#">Action</a></li>
            <li class="category-item" data-page="comedy"><a href="#">Comedy</a></li>
            <li class="category-item" data-page="drama"><a href="#">Drama</a></li>
            <li class="category-item" data-page="scifi"><a href="#">Sci-Fi</a></li>
            <li class="category-item" data-page="horror"><a href="#">Horror</a></li>
            <li class="category-item" data-page="mystery"><a href="#">Mystery</a></li>
            <!-- Animated underline indicator -->
            <span class="nav-active-indicator" id="nav-indicator"></span>
        </ul>

        <div class="nav-right">
            <a href="#" class="social-icon-link" aria-label="Join Discord Server">
                <svg class="discord-icon" viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">
                    <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a74.37,74.37,0,0,0,6.73-11A68.52,68.52,0,0,1,28,80.17c1-.76,2-1.56,3-2.38a74.83,74.83,0,0,0,65.06,0c1,.82,2,1.62,3,2.38a68.15,68.15,0,0,1-10.74,5.18,74.61,74.61,0,0,0,6.73,11,105.54,105.54,0,0,0,31.6-18.83C129.62,49.7,123.77,26.9,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.83,46,53.83,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.07,46,96.07,53,91,65.69,84.69,65.69Z" fill="#fff"/>
                </svg>
            </a>
            <button class="nav-btn-signin" type="button">
                <svg class="signin-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                Sign In
            </button>
        </div>
    </nav>

    <!-- ===== HOME PAGE ===== -->
    <div id="page-home">
        <main class="hero-container" id="hero-section">
            <div class="hero-overlay"></div>
            <div class="hero-content-wrapper">
                <div class="hero-max-panel" id="hero-animated-block">
                    <img src="" alt="Movie Title Logo" class="hero-logo-title" id="hero-logo">
                    <div class="hero-meta-badge-row" id="hero-meta"></div>
                    <p class="hero-snippet-text" id="hero-desc">Loading description...</p>
                    <div class="hero-action-control-bar">
                        <button type="button" class="hero-btn hero-btn-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon fill-current"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"></path></svg>
                            Watch Now
                        </button>
                        <button type="button" class="hero-btn hero-btn-secondary">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon opacity-80"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"></path><path d="m6.2 5.3 3.1 3.9"></path><path d="m12.4 3.4 3.1 4"></path><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path></svg>
                            Trailer
                        </button>
                    </div>
                </div>
                <div class="hero-timeline-tabs" role="tablist" aria-label="Carousel slides" id="hero-indicators"></div>
            </div>
        </main>

        <div class="catalog-container">
            <section class="category-section">
                <h2 class="category-title">Top 10 Today</h2>
                <div class="cards-slider" id="row-trending"></div>
            </section>
            <section class="category-section">
                <h2 class="category-title">Popular Anime</h2>
                <div class="cards-slider" id="row-anime"></div>
            </section>
            <section class="category-section">
                <h2 class="category-title">Trending K-Dramas</h2>
                <div class="cards-slider" id="row-kdrama"></div>
            </section>
            <section class="category-section">
                <h2 class="category-title">Western Horror</h2>
                <div class="cards-slider" id="row-horror"></div>
            </section>
            <section class="category-section">
                <h2 class="category-title">Coming Soon & New Releases</h2>
                <div class="cards-slider" id="row-upcoming"></div>
            </section>
        </div>
    </div>

    <!-- ===== CATEGORY PAGES (SPA) ===== -->
    <div id="page-category" class="page-hidden">
        <div class="category-page-view">
            <div class="category-page-header">
                <h1 id="category-page-title"></h1>
                <p class="category-page-subtitle" id="category-page-subtitle"></p>
            </div>
            <div class="category-grid-container" id="category-grid"></div>
        </div>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="detail-modal-overlay" id="detail-modal">
        <div class="modal-card-content skeleton" id="modal-card-wrapper">
            <button class="modal-close-btn" id="modal-close">&times;</button>
            <div class="modal-banner skeleton-element" id="modal-banner">
                <div class="modal-banner-overlay"></div>
                <div class="modal-banner-content">
                    <h2 id="modal-title"></h2>
                    <div class="modal-actions">
                        <button class="btn-stream">
                            <span class="play-icon">▶</span> Stream
                        </button>
                        <button class="btn-circle">+</button>
                    </div>
                </div>
            </div>
            <div class="modal-body-grid">
                <div class="modal-left-panel">
                    <div class="modal-meta-row">
                        <span class="match-score skeleton-text" id="modal-match"></span>
                        <span class="info-tag skeleton-text" id="modal-year"></span>
                        <span class="info-tag skeleton-text" id="modal-type"></span>
                        <span class="info-tag rating skeleton-text" id="modal-rating"></span>
                    </div>
                    <p class="modal-overview skeleton-line" id="modal-overview"></p>
                    <p class="modal-overview skeleton-line"></p>
                    <p class="modal-overview skeleton-line-short"></p>
                </div>
                <div class="modal-right-panel">
                    <p class="skeleton-text"><strong>Cast:</strong> <span id="modal-cast"></span></p>
                    <p class="skeleton-text"><strong>Genres:</strong> <span id="modal-genres"></span></p>
                    <p class="skeleton-text"><strong>Status:</strong> <span id="modal-runtime"></span></p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
